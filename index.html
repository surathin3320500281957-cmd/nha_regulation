<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทะเบียนข้อบังคับ การเคหะแห่งชาติ</title>
<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#2E3E5C; --paper:#FAF7F2; --paper-raised:#FFFFFF;
    --line:#E4DED2; --brass:#B08D57; --brass-soft:#E9DCC4; --slate:#5B6472;
    --ok:#4C7A5E; --ok-bg:#E7EFE9; --pending:#B4762A; --pending-bg:#F6E9D8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Sarabun','Noto Sans Thai','TH Sarabun New',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .topbar{background:var(--ink);color:var(--paper);padding:22px 28px 20px;border-bottom:4px solid var(--brass);}
  .topbar .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-soft);margin:0 0 4px;font-weight:600;}
  .topbar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;}
  .topbar .sub{margin:6px 0 0;font-size:13.5px;color:#C8D0E0;}
  .layout{display:grid;grid-template-columns:360px 1fr;gap:0;min-height:calc(100vh - 92px);}
  @media (max-width: 860px){.layout{grid-template-columns:1fr;}}
  .sidebar{border-right:1px solid var(--line);background:var(--paper-raised);padding:18px 16px 40px;overflow-y:auto;max-height:calc(100vh - 92px);}
  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--paper);color:var(--ink);}
  .search-wrap input:focus{outline:none;border-color:var(--brass);background:#fff;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--slate);cursor:pointer;font-family:inherit;transition:all .15s;}
  .chip:hover{border-color:var(--brass);color:var(--ink);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .count-line{font-size:12px;color:var(--slate);margin:0 2px 10px;}
  .reg-card{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:var(--paper-raised);transition:border-color .15s, background .15s;}
  .reg-card:hover{border-color:var(--brass);border-left-color:var(--brass);}
  .reg-card.selected{border-color:var(--ink);border-left-color:var(--brass);background:#F1ECE1;}
  .reg-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
  .reg-no{font-family:'Courier New',monospace;font-size:11px;color:var(--brass);font-weight:700;white-space:nowrap;}
  .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .status-dot.ready{background:var(--ok);}
  .status-dot.pending{background:var(--pending);opacity:.55;}
  .reg-title{font-size:13.5px;line-height:1.4;font-weight:600;color:var(--ink);}
  .reg-date{font-size:11.5px;color:var(--slate);margin-top:3px;}
  .main{padding:28px 40px 60px;overflow-y:auto;max-height:calc(100vh - 92px);}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--slate);text-align:center;}
  .empty-state .icon{font-size:38px;margin-bottom:12px;opacity:.35;}
  .detail-head{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;}
  .detail-head .badge-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em;}
  .badge.ready{background:var(--ok-bg);color:var(--ok);}
  .badge.pending{background:var(--pending-bg);color:var(--pending);}
  .badge.chabap{background:var(--brass-soft);color:#7A5B27;font-family:'Courier New',monospace;}
  .badge.cat{background:#EEF1F6;color:var(--ink-soft);}
  .detail-head h2{margin:0 0 6px;font-size:22px;line-height:1.35;}
  .detail-meta{font-size:13px;color:var(--slate);}
  .section-block{margin-bottom:26px;}
  .section-block h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);margin:0 0 10px;font-weight:700;}
  .prose{font-size:14.5px;line-height:1.75;color:var(--ink-soft);}
  table.authority-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px;}
  table.authority-table th{text-align:left;background:var(--ink);color:#fff;padding:9px 12px;font-weight:600;font-size:12.5px;}
  table.authority-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6;}
  table.authority-table tr:nth-child(even) td{background:#F7F4EE;}
  .committee-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:var(--paper-raised);}
  .committee-card .name{font-weight:700;font-size:14px;margin-bottom:4px;}
  .committee-card ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
  .sections-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .sec-item{border-bottom:1px solid var(--line);padding:11px 15px;}
  .sec-item:last-child{border-bottom:none;}
  .sec-item .sec-no{font-family:'Courier New',monospace;font-size:12px;color:var(--brass);font-weight:700;margin-bottom:3px;}
  .sec-item .sec-text{font-size:13.5px;line-height:1.65;color:var(--ink-soft);}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-size:11.5px;padding:4px 10px;background:#EEF1F6;border-radius:6px;color:var(--ink-soft);}
  .related-list{display:flex;flex-wrap:wrap;gap:8px;}
  .related-chip{font-size:12.5px;padding:6px 12px;border:1px solid var(--brass);color:var(--brass);border-radius:999px;cursor:pointer;background:#fff;}
  .related-chip:hover{background:var(--brass);color:#fff;}
  .pending-note{border:1.5px dashed var(--pending);background:var(--pending-bg);border-radius:8px;padding:16px 18px;font-size:13.5px;color:#7A4E15;line-height:1.7;}
  .stats-bar{display:flex;gap:18px;margin-bottom:22px;flex-wrap:wrap;}
  .stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:120px;}
  .stat .num{font-size:22px;font-weight:700;color:var(--ink);font-family:'Courier New',monospace;}
  .stat .lbl{font-size:11.5px;color:var(--slate);margin-top:2px;}
  .loading-msg{padding:40px;text-align:center;color:var(--slate);font-size:14px;}
  .error-msg{padding:16px 18px;background:#FBEAEA;border:1.5px solid #D98C8C;border-radius:8px;color:#8C2E2E;font-size:13.5px;line-height:1.6;}
</style>
</head>
<body>

<div class="topbar">
  <p class="eyebrow">การเคหะแห่งชาติ · โฟลเดอร์ระเบียบ</p>
  <h1>ทะเบียนข้อบังคับและระเบียบ</h1>
  <p class="sub">ค้นหา สรุปขอบเขต อำนาจ และหน้าที่ — แทนการเปิดอ่าน PDF ทีละไฟล์</p>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="ค้นหาชื่อเรื่อง เลขฉบับ...">
    </div>
    <div class="filter-row" id="categoryChips"></div>
    <p class="count-line" id="countLine"></p>
    <div id="cardList"></div>
  </aside>

  <main class="main" id="mainPanel">
    <div class="loading-msg">กำลังโหลดข้อมูล...</div>
  </main>
</div>

<script>
// ---------- STATE ----------
let ALL_ITEMS = [];
let activeCategory = "ทั้งหมด";
let searchTerm = "";
let selectedId = null;
let categories = ["ทั้งหมด"];

// ---------- LOAD DATA ----------
// อ่านข้อมูลทั้ง 41 เรื่องจากไฟล์ data.json (ต้องอยู่โฟลเดอร์เดียวกับ index.html นี้)
fetch('data.json')
  .then(res => {
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(data => {
    ALL_ITEMS = data.items;
    categories = ["ทั้งหมด", ...new Set(ALL_ITEMS.flatMap(i => i.category))];
    renderChips();
    renderList();
    renderInitialStats();
  })
  .catch(err => {
    document.getElementById('mainPanel').innerHTML =
      `<div class="error-msg">โหลด data.json ไม่สำเร็จ: ${err.message}<br>
      ตรวจสอบว่าไฟล์ data.json อยู่โฟลเดอร์เดียวกับ index.html และถ้าเปิดไฟล์นี้ตรงๆ จากเครื่อง (file://)
      เบราว์เซอร์อาจบล็อก fetch — ให้เปิดผ่าน GitHub Pages หรือรัน local server แทน
      (เช่น <code>python3 -m http.server</code>)</div>`;
  });

// ---------- RENDER: SIDEBAR ----------
function renderChips(){
  const wrap = document.getElementById('categoryChips');
  wrap.innerHTML = categories.map(c =>
    `<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCategory = el.dataset.cat;
      renderChips();
      renderList();
    });
  });
}

function filteredItems(){
  return ALL_ITEMS.filter(item=>{
    const matchCat = activeCategory === "ทั้งหมด" || item.category.includes(activeCategory);
    const hay = (item.title + " " + (item.chabap||"")).toLowerCase();
    const matchSearch = hay.includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });
}

function renderList(){
  const items = filteredItems();
  document.getElementById('countLine').textContent =
    `พบ ${items.length} รายการ (สรุปละเอียดแล้ว ${items.filter(i=>i.hasDetail).length})`;
  const list = document.getElementById('cardList');
  list.innerHTML = items.map(item => `
    <div class="reg-card ${item.id===selectedId?'selected':''}" data-id="${item.id}">
      <div class="row1">
        <span class="reg-no">${item.chabap ? 'ฉบับที่ '+item.chabap : 'ไม่มีเลขฉบับ'}</span>
        <span class="status-dot ${item.hasDetail?'ready':'pending'}" title="${item.hasDetail?'สรุปละเอียดแล้ว':'ยังไม่ได้สรุป'}"></span>
      </div>
      <div class="reg-title">${item.title}</div>
      <div class="reg-date">${item.date}</div>
    </div>
  `).join('');
  list.querySelectorAll('.reg-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedId = el.dataset.id;
      renderList();
      renderDetail();
    });
  });
}

// ---------- RENDER: DETAIL ----------
function renderDetail(){
  const main = document.getElementById('mainPanel');
  const item = ALL_ITEMS.find(i=>i.id===selectedId);
  if(!item) return;

  let html = `
    <div class="detail-head">
      <div class="badge-row">
        <span class="badge ${item.hasDetail?'ready':'pending'}">${item.hasDetail ? '✓ สรุปละเอียดแล้ว' : '○ ยังไม่ได้สรุป'}</span>
        ${item.chabap ? `<span class="badge chabap">ฉบับที่ ${item.chabap}</span>` : ''}
        ${item.category.map(c=>`<span class="badge cat">${c}</span>`).join('')}
      </div>
      <h2>${item.title}</h2>
      <div class="detail-meta">ประกาศใช้ ${item.date} · แก้ไขเพิ่มเติม ${item.amendments}</div>
    </div>
  `;

  if(!item.hasDetail){
    html += `
      <div class="pending-note">
        ยังไม่ได้อ่านและสรุปรายละเอียดของระเบียบฉบับนี้ (มีเฉพาะข้อมูลจากสารบัญ) —
        หากต้องการทราบขอบเขต อำนาจ หน้าที่ หรือเนื้อหาเต็มของฉบับนี้ แจ้งชื่อเรื่องหรือเลขฉบับได้เลย
        แล้วเพิ่มข้อมูลลงใน data.json ตาม schema เดียวกับฉบับที่มีอยู่
      </div>
    `;
    main.innerHTML = html;
    return;
  }

  html += `
    <div class="section-block">
      <h3>ขอบเขต</h3>
      <p class="prose">${item.summary.scope}</p>
    </div>
  `;

  if(item.summary.authority && item.summary.authority.length){
    html += `
      <div class="section-block">
        <h3>ชั้นอำนาจอนุมัติ</h3>
        <table class="authority-table">
          <thead><tr><th style="width:26%">ผู้มีอำนาจ</th><th style="width:56%">ขอบเขตอำนาจ</th><th style="width:18%">อ้างอิง</th></tr></thead>
          <tbody>
            ${item.summary.authority.map(a=>`
              <tr><td><strong>${a.holder}</strong></td><td>${a.limit}</td><td>${a.note||''}</td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  if(item.summary.committees && item.summary.committees.length){
    html += `
      <div class="section-block">
        <h3>คณะกรรมการที่เกี่ยวข้อง</h3>
        ${item.summary.committees.map(c=>`
          <div class="committee-card">
            <div class="name">${c.name}</div>
            <div class="prose">${c.composition}</div>
            <ul>${c.duties.map(d=>`<li>${d}</li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>
    `;
  }

  if(item.summary.methods){
    html += `
      <div class="section-block">
        <h3>วิธีดำเนินการ</h3>
        <p class="prose">${item.summary.methods}</p>
      </div>
    `;
  }

  if(item.sections && item.sections.length){
    html += `
      <div class="section-block">
        <h3>เนื้อหาเต็ม (แยกตามหมวด/ข้อ) — สำหรับอ้างอิง</h3>
        <div class="sections-list">
          ${item.sections.map(s=>`
            <div class="sec-item">
              <div class="sec-no">${s.no}</div>
              <div class="sec-text">${s.text}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  if(item.tags && item.tags.length){
    html += `
      <div class="section-block">
        <h3>คำสำคัญ</h3>
        <div class="tag-row">${item.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
      </div>
    `;
  }

  if(item.related && item.related.length){
    const relItems = item.related.map(rid => ALL_ITEMS.find(i=>i.id===rid)).filter(Boolean);
    if(relItems.length){
      html += `
        <div class="section-block">
          <h3>ระเบียบที่เกี่ยวข้อง</h3>
          <div class="related-list">
            ${relItems.map(r=>`<span class="related-chip" data-id="${r.id}">${r.chabap ? 'ฉบับที่ '+r.chabap+' — ' : ''}${r.title.length>40?r.title.slice(0,40)+'…':r.title}</span>`).join('')}
          </div>
        </div>
      `;
    }
  }

  if(item.source_note){
    html += `<p class="prose" style="font-size:12px;color:var(--slate);border-top:1px solid var(--line);padding-top:14px;">หมายเหตุ: ${item.source_note}</p>`;
  }

  main.innerHTML = html;
  main.querySelectorAll('.related-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedId = el.dataset.id;
      renderList();
      renderDetail();
      main.scrollTop = 0;
    });
  });
}

// ---------- STATS ----------
function renderInitialStats(){
  const main = document.getElementById('mainPanel');
  const ready = ALL_ITEMS.filter(i=>i.hasDetail).length;
  const pending = ALL_ITEMS.filter(i=>!i.hasDetail).length;
  main.innerHTML = `
    <div class="stats-bar">
      <div class="stat"><div class="num">${ALL_ITEMS.length}</div><div class="lbl">ระเบียบทั้งหมดในทะเบียน</div></div>
      <div class="stat"><div class="num">${ready}</div><div class="lbl">สรุปละเอียดแล้ว</div></div>
      <div class="stat"><div class="num">${pending}</div><div class="lbl">รอการสรุป</div></div>
    </div>
    <div class="empty-state" style="height:40vh;">
      <div class="icon">📋</div>
      <div>เลือกระเบียบทางซ้ายเพื่อดูรายละเอียด<br><span style="font-size:12.5px;">หรือค้นหาด้วยชื่อเรื่อง/เลขฉบับ</span></div>
    </div>
  `;
}

// ---------- EVENTS ----------
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderList();
});
</script>
</body>
</html>
