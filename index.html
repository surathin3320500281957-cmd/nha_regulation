<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทะเบียนข้อบังคับ การเคหะแห่งชาติ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3F4F8; --card:#FFFFFF; --line:#E3E6ED; --ink:#1F2430; --ink-soft:#4B5468; --slate:#6B7280;
    --blue:#2563EB; --blue-bg:#EAF0FE;
    --purple:#7C3AED; --purple-bg:#F1EAFE;
    --green:#16A34A; --green-bg:#E8F8EE;
    --orange:#F59E0B; --orange-bg:#FEF3DD;
    --red:#DC2626; --red-bg:#FCE9E9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Sarabun','Noto Sans Thai','TH Sarabun New',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .topbar{background:linear-gradient(135deg,#2563EB,#4F46E5);color:#fff;padding:18px 24px;}
  .topbar h1{margin:0;font-size:27px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .topbar .sub{margin:5px 0 0;font-size:17px;color:#DCE4FF;}

  /* ===== Persistent stats + filter panel, right under header ===== */
  .control-panel{background:var(--card);padding:16px 24px 14px;border-bottom:1px solid var(--line);}
  .stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .stat-box{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 18px;min-width:96px;text-align:center;position:relative;transition:all .15s;}
  .stat-box.clickable{cursor:pointer;}
  .stat-box.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08);}
  .stat-box.is-active{background:var(--ink);}
  .stat-box.is-active .num, .stat-box.is-active .lbl{color:#fff !important;}
  .stat-box .num{font-size:30px;font-weight:800;line-height:1;}
  .stat-box .lbl{font-size:15px;color:var(--slate);margin-top:4px;white-space:nowrap;}
  .stat-box.blue{border-left:5px solid var(--blue);} .stat-box.blue .num{color:var(--blue);}
  .stat-box.green{border-left:5px solid var(--green);} .stat-box.green .num{color:var(--green);}
  .stat-box.orange{border-left:5px solid var(--orange);} .stat-box.orange .num{color:var(--orange);}
  .stat-box.purple{border-left:5px solid var(--purple);} .stat-box.purple .num{color:var(--purple);}
  .stat-box.red{border-left:5px solid var(--red);} .stat-box.red .num{color:var(--red);}

  .search-clear-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:220px;}
  .search-wrap input{width:100%;padding:10px 14px 10px 36px;border:1.5px solid var(--line);border-radius:8px;font-size:18px;font-family:inherit;background:var(--bg);color:var(--ink);}
  .search-wrap input:focus{outline:none;border-color:var(--blue);background:#fff;}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}
  .clear-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;padding:9px 16px;font-size:17px;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:600;}
  .clear-btn:hover{border-color:var(--red);color:var(--red);}

  .cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{font-size:16.5px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--slate);cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;}
  .chip:hover{border-color:var(--blue);color:var(--blue);}
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .active-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:20px;}
  .active-filters .af-empty{font-size:16px;color:var(--slate);}
  .filter-pill{display:inline-flex;align-items:center;gap:6px;font-size:16.5px;font-weight:700;padding:6px 8px 6px 14px;border-radius:999px;color:#fff;}
  .filter-pill.p-search{background:var(--purple);}
  .filter-pill.p-cat{background:var(--blue);}
  .filter-pill .x{cursor:pointer;background:rgba(255,255,255,.25);border-radius:50%;width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;font-size:14.5px;line-height:1;}
  .filter-pill .x:hover{background:rgba(255,255,255,.45);}

  .layout{display:grid;grid-template-columns:360px 1fr;gap:0;min-height:calc(100vh - 230px);}
  @media (max-width: 860px){.layout{grid-template-columns:1fr;}}
  .sidebar{border-right:1px solid var(--line);background:var(--card);padding:14px 16px 40px;overflow-y:auto;max-height:calc(100vh - 230px);}
  .count-line{font-size:16px;color:var(--slate);margin:0 2px 10px;font-weight:600;}
  .reg-card{border:1.5px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:#fff;transition:all .15s;}
  .reg-card:hover{border-color:var(--blue);border-left-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.08);}
  .reg-card.selected{border-color:var(--purple);border-left-color:var(--purple);background:var(--purple-bg);}
  .reg-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
  .reg-no{font-family:'Courier New',monospace;font-size:15px;color:var(--purple);font-weight:800;white-space:nowrap;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .status-dot.ready{background:var(--green);}
  .status-dot.pending{background:var(--orange);}
  .reg-title{font-size:18.5px;line-height:1.4;font-weight:700;color:var(--ink);}
  .reg-date{font-size:15.5px;color:var(--slate);margin-top:3px;}
  .main{padding:26px 36px 60px;overflow-y:auto;max-height:calc(100vh - 230px);}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;color:var(--slate);text-align:center;}
  .empty-state .icon{font-size:38px;margin-bottom:12px;opacity:.35;}
  .detail-head{border-bottom:3px solid var(--blue);padding-bottom:16px;margin-bottom:22px;}
  .detail-head .badge-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .badge{font-size:15px;font-weight:800;padding:4px 11px;border-radius:999px;letter-spacing:.02em;}
  .badge.ready{background:var(--green-bg);color:var(--green);}
  .badge.pending{background:var(--orange-bg);color:var(--orange);}
  .badge.chabap{background:var(--purple-bg);color:var(--purple);font-family:'Courier New',monospace;}
  .badge.cat{background:var(--blue-bg);color:var(--blue);}
  .detail-head h2{margin:0 0 6px;font-size:31px;line-height:1.35;}
  .detail-meta{font-size:17px;color:var(--slate);}
  .detail-meta a{color:var(--blue);font-weight:700;text-decoration:none;}
  .section-block{margin-bottom:26px;}
  .section-block h3{font-size:16.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--purple);margin:0 0 10px;font-weight:800;}
  .prose{font-size:19px;line-height:1.75;color:var(--ink-soft);}
  table.authority-table{width:100%;border-collapse:collapse;font-size:18px;margin-top:4px;border-radius:8px;overflow:hidden;table-layout:fixed;}
  table.authority-table th{text-align:left;background:var(--blue);color:#fff;padding:9px 12px;font-weight:700;font-size:16.5px;word-break:break-word;overflow-wrap:break-word;}
  table.authority-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6;word-break:break-word;overflow-wrap:break-word;}
  table.authority-table tr:nth-child(even) td{background:#F7F8FC;}
  .table-scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;}
  .committee-card{border:1.5px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;}
  .committee-card .name{font-weight:800;font-size:19px;margin-bottom:4px;color:var(--green);}
  .committee-card ul{margin:6px 0 0;padding-left:18px;font-size:18px;color:var(--ink-soft);line-height:1.6;}
  .sections-list{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .sec-item{border-bottom:1px solid var(--line);padding:11px 15px;}
  .sec-item:last-child{border-bottom:none;}
  .sec-item .sec-no{font-family:'Courier New',monospace;font-size:16.5px;color:var(--purple);font-weight:800;margin-bottom:3px;}
  .sec-item .sec-text{font-size:18px;line-height:1.65;color:var(--ink-soft);}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-size:15.5px;padding:4px 11px;background:var(--purple-bg);border-radius:6px;color:var(--purple);font-weight:600;cursor:pointer;transition:all .12s;}
  .tag:hover{background:var(--purple);color:#fff;}
  .related-list{display:flex;flex-wrap:wrap;gap:8px;}
  .related-chip{font-size:16.5px;padding:6px 13px;border:1.5px solid var(--blue);color:var(--blue);border-radius:999px;cursor:pointer;background:#fff;font-weight:600;}
  .related-chip:hover{background:var(--blue);color:#fff;}
  .pending-note{border:1.5px dashed var(--orange);background:var(--orange-bg);border-radius:10px;padding:16px 18px;font-size:18px;color:#7A4E15;line-height:1.7;}
  .loading-msg{padding:40px;text-align:center;color:var(--slate);font-size:18px;}
  .error-msg{padding:16px 18px;background:var(--red-bg);border:1.5px solid var(--red);border-radius:10px;color:var(--red);font-size:18px;line-height:1.6;}

  @media print{
    body *{visibility:hidden;}
    #matrixView, #matrixView *{visibility:visible;}
    #matrixView{position:absolute;top:0;left:0;width:100%;padding:10px !important;}
    .matrix-export-row{display:none !important;}
    .topbar, .tab-bar, .control-panel{display:none !important;}
  }
  .matrix-export-row{display:flex;gap:10px;margin-bottom:16px;}
  .export-btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:9px 18px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff;}
  .export-btn.excel{background:#1D6F42;}
  .export-btn.excel:hover{background:#155230;}
  .export-btn.pdf{background:#C0392B;}
  .export-btn.pdf:hover{background:#96291F;}

  /* ===== Tabs ===== */
  .tab-bar{display:flex;gap:4px;background:#1E2A78;padding:0 24px;}
  .tab-btn{background:transparent;border:none;color:#C7D0F5;font-family:inherit;font-size:17px;font-weight:700;padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;}
  .tab-btn:hover{color:#fff;}
  .tab-btn.active{color:#fff;border-bottom-color:#fff;}
  .view{display:none;}
  .view.active{display:block;}

  /* ===== Manual tab specifics ===== */
  .chapter-badge{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--purple-bg);color:var(--purple);margin-bottom:6px;}
  .page-badge{font-family:'Courier New',monospace;font-size:14px;color:var(--slate);font-weight:700;}

  /* ===== Criteria tab (tab 3) specifics ===== */
  .doctype-badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;}
  .doctype-badge.case_memo{background:var(--orange-bg);color:var(--orange);}
  .doctype-badge.external_law{background:var(--red-bg);color:var(--red);}
  .doctype-badge.specialized_manual{background:var(--blue-bg);color:var(--blue);}
  .confidence-badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;}
  .confidence-badge.confirmed{background:var(--green-bg);color:var(--green);}
  .confidence-badge.partial{background:var(--orange-bg);color:var(--orange);}
  .confidence-badge.pending{background:#EEE;color:var(--slate);}
  .authority-basis-card{border:1.5px solid var(--purple);background:var(--purple-bg);border-radius:10px;padding:16px 18px;margin-bottom:10px;}
  .authority-basis-card .ab-row{margin-bottom:8px;font-size:15px;line-height:1.6;}
  .authority-basis-card .ab-row:last-child{margin-bottom:0;}
  .authority-basis-card .ab-label{font-weight:800;color:var(--purple);display:inline-block;min-width:110px;}
  .legal-ground-chip{display:inline-block;font-size:13.5px;padding:4px 12px;background:#fff;border:1.5px solid var(--purple);color:var(--purple);border-radius:999px;margin:2px 4px 2px 0;cursor:default;}
  .legal-ground-chip.clickable{cursor:pointer;}
  .legal-ground-chip.clickable:hover{background:var(--purple);color:#fff;}
  .doc-viewer-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px;}
  .doc-viewer-btn:hover{background:#2E3A5C;}
  .doc-viewer-frame{width:100%;height:650px;border:1.5px solid var(--line);border-radius:10px;margin-top:14px;}
  .sub-list{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px;}
  .sub-item{padding:9px 15px;border-bottom:1px solid var(--line);font-size:17px;color:var(--ink-soft);line-height:1.6;}
  .sub-item:last-child{border-bottom:none;}
  .manual-note{border:1.5px solid var(--blue);background:var(--blue-bg);border-radius:10px;padding:14px 18px;font-size:17px;color:var(--ink-soft);line-height:1.7;margin-top:10px;}
  .xlink-btn{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;margin-right:8px;}
  .xlink-btn:hover{background:#128038;}
  .reg-card.deep-manual-card{border-left-color:var(--blue);}
  .reg-card.deep-manual-card:hover{border-left-color:var(--blue);}
</style>
</head>
<body>

<div class="topbar">
  <h1>📋 ทะเบียนข้อบังคับและระเบียบ การเคหะแห่งชาติ</h1>
  <p class="sub">ค้นหา สรุปขอบเขต อำนาจ และหน้าที่ — แทนการเปิดอ่าน PDF ทีละไฟล์</p>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tabBrowseBtn">📋 ระเบียบและข้อบังคับ</button>
  <button class="tab-btn" id="tabManualBtn">📘 คู่มือบริหารชุมชน</button>
  <button class="tab-btn" id="tabProcBtn">📦 คู่มือจัดซื้อจัดจ้าง</button>
  <button class="tab-btn" id="tabCriteriaBtn">📚 หลักเกณฑ์เพิ่มเติม</button>
</div>

<div class="view active" id="viewBrowse">
<div class="control-panel">
  <div class="stats-row" id="statsRow"></div>

  <div class="search-clear-row">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="ค้นหาชื่อเรื่อง เลขฉบับ...">
    </div>
    <button class="clear-btn" id="clearBtn">✕ ล้างตัวกรอง</button>
  </div>

  <div class="cat-row" id="categoryChips"></div>
  <div class="active-filters" id="activeFilters"></div>
</div>

<div class="layout">
  <aside class="sidebar">
    <p class="count-line" id="countLine"></p>
    <div id="cardList"></div>
  </aside>

  <main class="main" id="mainPanel">
    <div class="loading-msg">กำลังโหลดข้อมูล...</div>
  </main>
</div>
</div><!-- /viewBrowse -->

<div class="view" id="viewManual">
<div class="control-panel">
  <div class="stats-row" id="manualStatsRow"></div>

  <div class="search-clear-row">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="manualSearchInput" type="text" placeholder="ค้นหาชื่อเรื่อง หมวด...">
    </div>
    <button class="clear-btn" id="manualClearBtn">✕ ล้างตัวกรอง</button>
    <button class="clear-btn" id="matrixToggleBtn" style="background:var(--purple);color:#fff;border-color:var(--purple);">⚖️ ตารางอำนาจอนุมัติรวม</button>
  </div>

  <div class="cat-row" id="manualChapterChips"></div>
  <div class="active-filters" id="manualActiveFilters"></div>
</div>

<div class="layout" id="manualNormalLayout">
  <aside class="sidebar">
    <p class="count-line" id="manualCountLine"></p>
    <div id="manualCardList"></div>
  </aside>

  <main class="main" id="manualMainPanel">
    <div class="loading-msg">กำลังโหลดข้อมูลคู่มือ...</div>
  </main>
</div>

<div id="matrixView" style="display:none;padding:26px 36px 60px;">
</div>
</div><!-- /viewManual -->

<div class="view" id="viewProc">
<div class="control-panel">
  <div class="stats-row" id="procStatsRow"></div>

  <div class="search-clear-row">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="procSearchInput" type="text" placeholder="ค้นหาชื่อเรื่อง หมวด...">
    </div>
    <button class="clear-btn" id="procClearBtn">✕ ล้างตัวกรอง</button>
  </div>

  <div class="cat-row" id="procChapterChips"></div>
  <div class="active-filters" id="procActiveFilters"></div>
</div>

<div class="layout">
  <aside class="sidebar">
    <p class="count-line" id="procCountLine"></p>
    <div id="procCardList"></div>
  </aside>

  <main class="main" id="procMainPanel">
    <div class="loading-msg">กำลังโหลดข้อมูลคู่มือจัดซื้อจัดจ้าง...</div>
  </main>
</div>
</div><!-- /viewProc -->

<div class="view" id="viewCriteria">
<div class="control-panel">
  <div class="stats-row" id="critStatsRow"></div>

  <div class="search-clear-row">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="critSearchInput" type="text" placeholder="ค้นหาชื่อเรื่อง เลขที่โฉนด โครงการ...">
    </div>
    <button class="clear-btn" id="critClearBtn">✕ ล้างตัวกรอง</button>
  </div>

  <div class="cat-row" id="critTypeChips"></div>
  <div class="active-filters" id="critActiveFilters"></div>
</div>

<div class="layout">
  <aside class="sidebar">
    <p class="count-line" id="critCountLine"></p>
    <div id="critCardList"></div>
  </aside>

  <main class="main" id="critMainPanel">
    <div class="loading-msg">กำลังโหลดข้อมูลหลักเกณฑ์เพิ่มเติม...</div>
  </main>
</div>

<div id="critDeepView" style="display:none;padding:26px 36px 60px;"></div>
</div><!-- /viewCriteria -->

<script>
// ---------- STATE ----------
let ALL_ITEMS = [];
let activeCategory = "ทั้งหมด";
let searchTerm = "";
let selectedId = null;
let categories = ["ทั้งหมด"];
const CAT_COLORS = { "ที่ดิน/ทรัพย์สิน":"green", "บุคคล/พนักงาน":"orange", "การเงิน/บริหารทั่วไป":"purple", "ธรรมาภิบาล/บริหาร":"red" };

// ---------- LOAD DATA ----------
fetch('data.json')
  .then(res => {
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(data => {
    ALL_ITEMS = data.items;
    categories = ["ทั้งหมด", ...new Set(ALL_ITEMS.flatMap(i => i.category))];
    renderStats();
    renderChips();
    renderActiveFilters();
    renderList();
    renderInitialState();
  })
  .catch(err => {
    document.getElementById('mainPanel').innerHTML =
      `<div class="error-msg">โหลด data.json ไม่สำเร็จ: ${err.message}<br>
      ตรวจสอบว่าไฟล์ data.json อยู่โฟลเดอร์เดียวกับ index.html และถ้าเปิดไฟล์นี้ตรงๆ จากเครื่อง (file://)
      เบราว์เซอร์อาจบล็อก fetch — ให้เปิดผ่าน GitHub Pages หรือรัน local server แทน
      (เช่น <code>python3 -m http.server</code>)</div>`;
  });

// ---------- RENDER: STATS ----------
function renderStats(){
  const total = ALL_ITEMS.length;
  const ready = ALL_ITEMS.filter(i=>i.hasDetail).length;
  const pending = total - ready;
  let html = `
    <div class="stat-box blue"><div class="num">${total}</div><div class="lbl">รายการทั้งหมด</div></div>
    <div class="stat-box green"><div class="num">${ready}</div><div class="lbl">สรุปละเอียดแล้ว</div></div>
    <div class="stat-box orange"><div class="num">${pending}</div><div class="lbl">รอสรุปเพิ่ม</div></div>
  `;
  categories.filter(c=>c!=="ทั้งหมด").forEach(c=>{
    const n = ALL_ITEMS.filter(i=>i.category.includes(c)).length;
    const color = CAT_COLORS[c] || "purple";
    html += `<div class="stat-box ${color}"><div class="num">${n}</div><div class="lbl">${c}</div></div>`;
  });
  document.getElementById('statsRow').innerHTML = html;
}

// ---------- RENDER: CATEGORY CHIPS ----------
function renderChips(){
  const wrap = document.getElementById('categoryChips');
  wrap.innerHTML = categories.map(c =>
    `<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCategory = el.dataset.cat;
      renderStats();
      renderChips();
      renderActiveFilters();
      renderList();
    });
  });
}

// ---------- RENDER: ACTIVE FILTER PILLS (removable) ----------
function renderActiveFilters(){
  const wrap = document.getElementById('activeFilters');
  const pills = [];
  if(searchTerm.trim()){
    pills.push(`<span class="filter-pill p-search">ค้นหา: "${searchTerm}" <span class="x" data-clear="search">✕</span></span>`);
  }
  if(activeCategory !== "ทั้งหมด"){
    pills.push(`<span class="filter-pill p-cat">หมวด: ${activeCategory} <span class="x" data-clear="cat">✕</span></span>`);
  }
  wrap.innerHTML = pills.length ? pills.join('') : `<span class="af-empty">ไม่มีตัวกรองที่ใช้งานอยู่</span>`;
  wrap.querySelectorAll('.x').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.clear === 'search'){
        searchTerm = '';
        document.getElementById('searchInput').value = '';
      } else if(el.dataset.clear === 'cat'){
        activeCategory = 'ทั้งหมด';
      }
      renderStats();
      renderChips();
      renderActiveFilters();
      renderList();
    });
  });
}

function filteredItems(){
  return ALL_ITEMS.filter(item=>{
    const matchCat = activeCategory === "ทั้งหมด" || item.category.includes(activeCategory);
    const hay = (item.title + " " + (item.chabap||"") + " " + (item.tags?item.tags.join(" "):"")).toLowerCase();
    const matchSearch = hay.includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });
}

function renderList(){
  const items = filteredItems();
  document.getElementById('countLine').textContent =
    `พบ ${items.length} รายการ (สรุปละเอียดแล้ว ${items.filter(i=>i.hasDetail).length})`;
  const list = document.getElementById('cardList');
  list.innerHTML = items.map(item => `
    <div class="reg-card ${item.id===selectedId?'selected':''}" data-id="${item.id}">
      <div class="row1">
        <span class="reg-no">${item.chabap ? 'ฉบับที่ '+item.chabap : 'ไม่มีเลขฉบับ'}</span>
        <span class="status-dot ${item.hasDetail?'ready':'pending'}" title="${item.hasDetail?'สรุปละเอียดแล้ว':'ยังไม่ได้สรุป'}"></span>
      </div>
      <div class="reg-title">${item.title}</div>
      <div class="reg-date">${item.date}</div>
    </div>
  `).join('');
  list.querySelectorAll('.reg-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedId = el.dataset.id;
      renderList();
      renderDetail();
    });
  });
}

// ---------- RENDER: DETAIL ----------
function renderDetail(){
  const main = document.getElementById('mainPanel');
  const item = ALL_ITEMS.find(i=>i.id===selectedId);
  if(!item) return;

  let html = `
    <div class="detail-head">
      <div class="badge-row">
        <span class="badge ${item.hasDetail?'ready':'pending'}">${item.hasDetail ? '✓ สรุปละเอียดแล้ว' : '○ ยังไม่ได้สรุป'}</span>
        ${item.chabap ? `<span class="badge chabap">ฉบับที่ ${item.chabap}</span>` : ''}
        ${item.category.map(c=>`<span class="badge cat">${c}</span>`).join('')}
      </div>
      <h2>${item.title}</h2>
      <div class="detail-meta">ประกาศใช้ ${item.date} · แก้ไขเพิ่มเติม ${item.amendments}
        ${item.source_url ? ` · <a href="${item.source_url}" target="_blank" rel="noopener">เปิดต้นฉบับ (Google Drive) ↗</a>` : ''}
      </div>
    </div>
  `;

  if(!item.hasDetail){
    html += `
      <div class="pending-note">
        ยังไม่ได้อ่านและสรุปรายละเอียดของระเบียบฉบับนี้ (มีเฉพาะข้อมูลจากสารบัญ) —
        หากต้องการทราบขอบเขต อำนาจ หน้าที่ หรือเนื้อหาเต็มของฉบับนี้ แจ้งชื่อเรื่องหรือเลขฉบับได้เลย
        แล้วเพิ่มข้อมูลลงใน data.json ตาม schema เดียวกับฉบับที่มีอยู่
      </div>
    `;
    main.innerHTML = html;
    return;
  }

  html += `
    <div class="section-block">
      <h3>ขอบเขต</h3>
      <p class="prose">${item.summary.scope}</p>
    </div>
  `;

  if(item.summary.authority && item.summary.authority.length){
    html += `
      <div class="section-block">
        <h3>ชั้นอำนาจอนุมัติ</h3>
        <table class="authority-table">
          <thead><tr><th style="width:26%">ผู้มีอำนาจ</th><th style="width:56%">ขอบเขตอำนาจ</th><th style="width:18%">อ้างอิง</th></tr></thead>
          <tbody>
            ${item.summary.authority.map(a=>`
              <tr><td><strong>${a.holder}</strong></td><td>${a.limit}</td><td>${a.note||''}</td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  if(item.summary.committees && item.summary.committees.length){
    html += `
      <div class="section-block">
        <h3>คณะกรรมการที่เกี่ยวข้อง</h3>
        ${item.summary.committees.map(c=>`
          <div class="committee-card">
            <div class="name">${c.name}</div>
            <div class="prose">${c.composition}</div>
            <ul>${c.duties.map(d=>`<li>${d}</li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>
    `;
  }

  if(item.summary.methods){
    html += `
      <div class="section-block">
        <h3>วิธีดำเนินการ</h3>
        <p class="prose">${item.summary.methods}</p>
      </div>
    `;
  }

  if(item.sections && item.sections.length){
    html += `
      <div class="section-block">
        <h3>เนื้อหาเต็ม (แยกตามหมวด/ข้อ) — สำหรับอ้างอิง</h3>
        <div class="sections-list">
          ${item.sections.map(s=>`
            <div class="sec-item">
              <div class="sec-no">${s.no}</div>
              <div class="sec-text">${s.text}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  if(item.tags && item.tags.length){
    html += `
      <div class="section-block">
        <h3>คำสำคัญ</h3>
        <div class="tag-row">${item.tags.map(t=>`<span class="tag" data-tag="${t}">#${t}</span>`).join('')}</div>
      </div>
    `;
  }

  if(item.related && item.related.length){
    const relItems = item.related.map(rid => ALL_ITEMS.find(i=>i.id===rid)).filter(Boolean);
    if(relItems.length){
      html += `
        <div class="section-block">
          <h3>ระเบียบที่เกี่ยวข้อง</h3>
          <div class="related-list">
            ${relItems.map(r=>`<span class="related-chip" data-id="${r.id}">${r.chabap ? 'ฉบับที่ '+r.chabap+' — ' : ''}${r.title.length>40?r.title.slice(0,40)+'…':r.title}</span>`).join('')}
          </div>
        </div>
      `;
    }
  }

  if(item.source_note){
    html += `<p class="prose" style="font-size:16px;color:var(--slate);border-top:1px solid var(--line);padding-top:14px;">หมายเหตุ: ${item.source_note}</p>`;
  }

  main.innerHTML = html;
  main.querySelectorAll('.related-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedId = el.dataset.id;
      renderList();
      renderDetail();
      main.scrollTop = 0;
    });
  });
  main.querySelectorAll('.tag').forEach(el=>{
    el.addEventListener('click', ()=>{
      const kw = el.dataset.tag;
      searchTerm = kw;
      document.getElementById('searchInput').value = kw;
      activeCategory = 'ทั้งหมด';
      renderStats();
      renderChips();
      renderActiveFilters();
      renderList();
      document.querySelector('.sidebar').scrollTop = 0;
      document.getElementById('searchInput').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}

// ---------- INITIAL STATE (no selection) ----------
function renderInitialState(){
  const main = document.getElementById('mainPanel');
  main.innerHTML = `
    <div class="empty-state">
      <div class="icon">📋</div>
      <div>เลือกระเบียบทางซ้ายเพื่อดูรายละเอียด<br><span style="font-size:16.5px;">หรือค้นหาด้วยชื่อเรื่อง/เลขฉบับด้านบน</span></div>
    </div>
  `;
}

// ---------- EVENTS ----------
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderActiveFilters();
  renderList();
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  searchTerm = '';
  activeCategory = 'ทั้งหมด';
  document.getElementById('searchInput').value = '';
  renderStats();
  renderChips();
  renderActiveFilters();
  renderList();
});

// ---------- TABS ----------
const tabBrowseBtn = document.getElementById('tabBrowseBtn');
const tabManualBtn = document.getElementById('tabManualBtn');
const tabProcBtn = document.getElementById('tabProcBtn');
const tabCriteriaBtn = document.getElementById('tabCriteriaBtn');
const viewBrowse = document.getElementById('viewBrowse');
const viewManual = document.getElementById('viewManual');
const viewProc = document.getElementById('viewProc');
const viewCriteria = document.getElementById('viewCriteria');
let manualLoaded = false;
let procLoaded = false;
let criteriaLoaded = false;

const allTabs = [
  { btn: tabBrowseBtn, view: viewBrowse, onShow: null },
  { btn: tabManualBtn, view: viewManual, onShow: ()=>{ if(!manualLoaded) loadManual(); } },
  { btn: tabProcBtn, view: viewProc, onShow: ()=>{ if(!procLoaded) loadProc(); } },
  { btn: tabCriteriaBtn, view: viewCriteria, onShow: ()=>{ if(!criteriaLoaded) loadCriteria(); } }
];
allTabs.forEach(t=>{
  t.btn.addEventListener('click', ()=>{
    allTabs.forEach(o=>{
      o.btn.classList.toggle('active', o===t);
      o.view.classList.toggle('active', o===t);
    });
    if(t.onShow) t.onShow();
  });
});

// ---------- MANUAL TAB: state ----------
let MANUAL_ITEMS = [];
let MANUAL_META = {};
let manualActiveChapter = "ทั้งหมด";
let manualSearchTerm = "";
let manualSelectedId = null;
let manualChapters = ["ทั้งหมด"];
let manualSpecialFilter = "none"; // 'none' | 'linked' | 'notes'
const CH_COLORS = ["blue","green","orange","purple","red","blue","green","purple"];

function loadManual(){
  fetch('manual.json')
    .then(res => { if(!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(data => {
      MANUAL_META = data.meta;
      MANUAL_ITEMS = data.items;
      manualLoaded = true;
      const chapterOrder = [...new Set(MANUAL_ITEMS.map(i=>i.chapter_title))];
      manualChapters = ["ทั้งหมด", ...chapterOrder];
      renderManualStats();
      renderManualChips();
      renderManualActiveFilters();
      renderManualList();
      renderManualInitialState();
    })
    .catch(err => {
      document.getElementById('manualMainPanel').innerHTML =
        `<div class="error-msg">โหลด manual.json ไม่สำเร็จ: ${err.message}<br>
        ตรวจสอบว่าไฟล์ manual.json อยู่โฟลเดอร์เดียวกับ index.html</div>`;
    });
}

function manualHasNote(item){
  return !!(item.note || (item.content && item.content.note_extra));
}
function manualHasLink(item){
  return !!(item.related_regulation && item.related_regulation.length);
}

function renderManualStats(){
  const total = MANUAL_ITEMS.length;
  const withXlink = MANUAL_ITEMS.filter(manualHasLink).length;
  const withNote = MANUAL_ITEMS.filter(manualHasNote).length;
  let html = `
    <div class="stat-box blue"><div class="num">${total}</div><div class="lbl">ส่วน/หัวข้อทั้งหมด</div></div>
    <div class="stat-box green clickable ${manualSpecialFilter==='linked'?'is-active':''}" data-special="linked"><div class="num">${withXlink}</div><div class="lbl">🔗 เชื่อมโยงกับระเบียบ</div></div>
    <div class="stat-box orange clickable ${manualSpecialFilter==='notes'?'is-active':''}" data-special="notes"><div class="num">${withNote}</div><div class="lbl">📌 มีหมายเหตุพิเศษ</div></div>
    <div class="stat-box purple"><div class="num">${MANUAL_META.total_pages||'—'}</div><div class="lbl">หน้าทั้งหมดในเล่ม</div></div>
  `;
  document.getElementById('manualStatsRow').innerHTML = html;
  document.querySelectorAll('#manualStatsRow .stat-box.clickable').forEach(el=>{
    el.addEventListener('click', ()=>{
      const val = el.dataset.special;
      manualSpecialFilter = (manualSpecialFilter === val) ? 'none' : val;
      renderManualStats();
      renderManualActiveFilters();
      renderManualList();
    });
  });
}

function renderManualChips(){
  const wrap = document.getElementById('manualChapterChips');
  wrap.innerHTML = manualChapters.map(c =>
    `<button class="chip ${c===manualActiveChapter?'active':''}" data-ch="${c}">${c}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      manualActiveChapter = el.dataset.ch;
      renderManualChips();
      renderManualActiveFilters();
      renderManualList();
    });
  });
}

function renderManualActiveFilters(){
  const wrap = document.getElementById('manualActiveFilters');
  const pills = [];
  if(manualSearchTerm.trim()){
    pills.push(`<span class="filter-pill p-search">ค้นหา: "${manualSearchTerm}" <span class="x" data-clear="search">✕</span></span>`);
  }
  if(manualActiveChapter !== "ทั้งหมด"){
    pills.push(`<span class="filter-pill p-cat">หมวด: ${manualActiveChapter} <span class="x" data-clear="ch">✕</span></span>`);
  }
  if(manualSpecialFilter === 'linked'){
    pills.push(`<span class="filter-pill" style="background:var(--green);">🔗 เฉพาะที่เชื่อมโยงกับระเบียบ <span class="x" data-clear="special">✕</span></span>`);
  }
  if(manualSpecialFilter === 'notes'){
    pills.push(`<span class="filter-pill" style="background:var(--orange);">📌 เฉพาะที่มีหมายเหตุพิเศษ <span class="x" data-clear="special">✕</span></span>`);
  }
  wrap.innerHTML = pills.length ? pills.join('') : `<span class="af-empty">ไม่มีตัวกรองที่ใช้งานอยู่</span>`;
  wrap.querySelectorAll('.x').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.clear === 'search'){
        manualSearchTerm = '';
        document.getElementById('manualSearchInput').value = '';
      } else if(el.dataset.clear === 'ch'){
        manualActiveChapter = 'ทั้งหมด';
      } else if(el.dataset.clear === 'special'){
        manualSpecialFilter = 'none';
      }
      renderManualStats();
      renderManualChips();
      renderManualActiveFilters();
      renderManualList();
    });
  });
}

function manualFilteredItems(){
  return MANUAL_ITEMS.filter(item=>{
    const matchCh = manualActiveChapter === "ทั้งหมด" || item.chapter_title === manualActiveChapter;
    const hay = (item.title + " " + item.chapter_title + " " + (item.sub?item.sub.join(" "):"")).toLowerCase();
    const matchSearch = hay.includes(manualSearchTerm.toLowerCase());
    const matchSpecial = manualSpecialFilter === 'none'
      || (manualSpecialFilter === 'linked' && manualHasLink(item))
      || (manualSpecialFilter === 'notes' && manualHasNote(item));
    return matchCh && matchSearch && matchSpecial;
  });
}

function manualHasAuthority(item){
  return !!(item.authority && item.authority.length);
}

function renderManualList(){
  const items = manualFilteredItems();
  document.getElementById('manualCountLine').textContent = `พบ ${items.length} รายการ`;
  const list = document.getElementById('manualCardList');
  list.innerHTML = items.map(item => `
    <div class="reg-card ${item.id===manualSelectedId?'selected':''}" data-id="${item.id}">
      <div class="row1">
        <span class="reg-no">หมวด ${item.chapter_no===99?'ผนวก':item.chapter_no} · ${item.section_no}</span>
        <span class="page-badge">น.${item.page||'-'}</span>
      </div>
      <div class="reg-title">${item.title}</div>
      <div class="row1" style="margin-top:5px;">
        <span class="reg-date">${item.chapter_title}</span>
        <span style="display:flex;gap:4px;">
          ${manualHasAuthority(item) ? '<span title="มีตารางอำนาจอนุมัติ" style="font-size:13px;">⚖️</span>' : ''}
          ${manualHasLink(item) ? '<span title="เชื่อมโยงกับระเบียบ" style="font-size:13px;">🔗</span>' : ''}
          ${manualHasNote(item) ? '<span title="มีหมายเหตุพิเศษ" style="font-size:13px;">📌</span>' : ''}
        </span>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.reg-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      manualSelectedId = el.dataset.id;
      renderManualList();
      renderManualDetail();
    });
  });
}

function renderManualDetail(){
  const main = document.getElementById('manualMainPanel');
  const item = MANUAL_ITEMS.find(i=>i.id===manualSelectedId);
  if(!item) return;

  let html = `
    <div class="detail-head">
      <div class="chapter-badge">${item.chapter_title} ${item.chapter_no!==99?'· ส่วนที่ '+item.section_no:''}</div>
      <h2>${item.title}</h2>
      <div class="detail-meta">หน้า ${item.page||'-'} จากทั้งหมด ${MANUAL_META.total_pages} หน้า
        ${MANUAL_META.source_url ? ` · <a href="${MANUAL_META.source_url}" target="_blank" rel="noopener">เปิดต้นฉบับ (Google Drive) ↗</a>` : ''}
      </div>
    </div>
  `;

  if(item.content){
    if(item.content.overview){
      html += `<div class="section-block"><h3>ภาพรวม</h3><p class="prose">${item.content.overview}</p></div>`;
    }
    if(item.authority && item.authority.length){
      html += `
        <div class="section-block">
          <h3>ชั้นอำนาจอนุมัติ</h3>
          <table class="authority-table">
            <thead><tr><th style="width:32%">ผู้มีอำนาจ</th><th style="width:24%">ประเภท</th><th style="width:44%">วงเงิน/ขอบเขต</th></tr></thead>
            <tbody>
              ${item.authority.map(a=>`
                <tr><td><strong>${a.holder}</strong></td><td>${a.category}</td><td>${a.limit}${a.note?' <span style="color:var(--slate);font-size:13px;">('+a.note+')</span>':''}</td></tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
    if(item.content.steps && item.content.steps.length){
      html += `<div class="section-block"><h3>รายละเอียด</h3><div class="sub-list">`;
      item.content.steps.forEach(s=>{
        html += `<div class="sub-item"><strong style="color:var(--ink);">${s.title}</strong><br>${s.detail}</div>`;
      });
      html += `</div></div>`;
    }
    if(item.content.contact || item.content.data_asof){
      html += `<p class="prose" style="font-size:16px;color:var(--slate);">${item.content.contact||''}${item.content.contact && item.content.data_asof ? ' · ' : ''}${item.content.data_asof||''}</p>`;
    }
  } else if(item.sub && item.sub.length){
    html += `
      <div class="section-block">
        <h3>หัวข้อย่อย</h3>
        <div class="sub-list">
          ${item.sub.map(s=>`<div class="sub-item">${s}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if(item.related_regulation && item.related_regulation.length){
    html += `<div class="section-block"><h3>เชื่อมโยงกับข้อบังคับ/ระเบียบ</h3>`;
    item.related_regulation.forEach(rid=>{
      html += `<button class="xlink-btn" data-xlink="${rid}">📋 เปิดฉบับที่เกี่ยวข้องในทะเบียนข้อบังคับ →</button>`;
    });
    html += `</div>`;
  }

  if(item.note){
    html += `<div class="manual-note"><strong>หมายเหตุ:</strong> ${item.note}</div>`;
  }
  if(item.content && item.content.note_extra){
    html += `<div class="manual-note"><strong>หมายเหตุเพิ่มเติม:</strong> ${item.content.note_extra}</div>`;
  }

  main.innerHTML = html;
  main.querySelectorAll('.xlink-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const rid = el.dataset.xlink;
      tabBrowseBtn.click();
      selectedId = rid;
      renderList();
      renderDetail();
      document.querySelector('#viewBrowse .main').scrollTop = 0;
    });
  });
}

function renderManualInitialState(){
  const main = document.getElementById('manualMainPanel');
  main.innerHTML = `

let procSearchTerm = "";
let procSelectedId = null;
let procChapters = ["ทั้งหมด"];

function loadProc(){
  fetch('procurement.json')
    .then(res => { if(!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(data => {
      PROC_META = data.meta || {};
      PROC_ITEMS = data.items || [];
      procLoaded = true;
      const chapterOrder = [...new Set(PROC_ITEMS.map(i=>i.chapter_title))];
      procChapters = ["ทั้งหมด", ...chapterOrder];
      renderProcStats();
      renderProcChips();
      renderProcActiveFilters();

        `<div class="error-msg">โหลด procurement.json ไม่สำเร็จ: ${err.message}<br>

}

function procHasTable(item){ return !!(item.content && item.content.table); }
function procHasSteps(item){ return !!(item.content && item.content.steps && item.content.steps.length); }
function procHasNote(item){ return !!(item.content && item.content.note_extra); }

function renderProcStats(){
  const total = PROC_ITEMS.length;
  const withTable = PROC_ITEMS.filter(procHasTable).length;
  const withNote = PROC_ITEMS.filter(procHasNote).length;
  let html = `
    <div class="stat-box blue"><div class="num">${total}</div><div class="lbl">หัวข้อทั้งหมด</div></div>
    <div class="stat-box green"><div class="num">${procChapters.length-1}</div><div class="lbl">บททั้งหมด</div></div>
    <div class="stat-box orange"><div class="num">${withTable}</div><div class="lbl">📊 มีตารางประกอบ</div></div>
    <div class="stat-box purple"><div class="num">${withNote}</div><div class="lbl">📌 มีหมายเหตุพิเศษ</div></div>
  `;
  document.getElementById('procStatsRow').innerHTML = html;
}

function renderProcChips(){
  const wrap = document.getElementById('procChapterChips');
  wrap.innerHTML = procChapters.map(c =>
    `<button class="chip ${c===procActiveChapter?'active':''}" data-ch="${c}">${c}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      procActiveChapter = el.dataset.ch;
      renderProcChips();
      renderProcActiveFilters();
      renderProcList();
    });
  });
}

function renderProcActiveFilters(){
  const wrap = document.getElementById('procActiveFilters');
  const pills = [];
  if(procSearchTerm.trim()){
    pills.push(`<span class="filter-pill p-search">ค้นหา: "${procSearchTerm}" <span class="x" data-clear="search">✕</span></span>`);
  }
  if(procActiveChapter !== "ทั้งหมด"){
    pills.push(`<span class="filter-pill p-cat">บท: ${procActiveChapter} <span class="x" data-clear="ch">✕</span></span>`);
  }
  wrap.innerHTML = pills.length ? pills.join('') : `<span class="af-empty">ไม่มีตัวกรองที่ใช้งานอยู่</span>`;
  wrap.querySelectorAll('.x').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.clear === 'search'){
        procSearchTerm = '';
        document.getElementById('procSearchInput').value = '';
      } else if(el.dataset.clear === 'ch'){
        procActiveChapter = 'ทั้งหมด';
      }
      renderProcChips();
      renderProcActiveFilters();
      renderProcList();
    });
  });
}

function procFilteredItems(){
  return PROC_ITEMS.filter(item=>{
    const matchCh = procActiveChapter === "ทั้งหมด" || item.chapter_title === procActiveChapter;
    const hay = (item.title + " " + item.chapter_title).toLowerCase();
    const matchSearch = hay.includes(procSearchTerm.toLowerCase());
    return matchCh && matchSearch;
  });
}

function renderProcDetail(){
  const main = document.getElementById('procMainPanel');
  const item = PROC_ITEMS.find(i=>i.id===procSelectedId);
  if(!item) return;

  let html = `
    <div class="detail-head">
      <div class="chapter-badge">${item.chapter_title} · ส่วนที่ ${item.section_no}</div>
      <h2>${item.title}</h2>
      <div class="detail-meta">${PROC_META.title||''}
        ${PROC_META.source_url ? ` · <a href="${PROC_META.source_url}" target="_blank" rel="noopener">เปิดต้นฉบับ (Google Drive) ↗</a>` : ''}
      </div>
    </div>
  `;

  const c = item.content || {};

  if(c.overview){
    html += `<div class="section-block"><h3>ภาพรวม</h3><p class="prose">${c.overview}</p></div>`;
  }

  if(c.table && c.table.columns){
    html += `<div class="section-block"><h3>ตารางประกอบ</h3>`;
    if(c.table.title){ html += `<p class="prose" style="font-size:16px;margin-bottom:8px;">${c.table.title}</p>`; }
    html += `<div class="table-scroll-wrap"><table class="authority-table"><thead><tr>`;
    c.table.columns.forEach(col=>{ html += `<th>${col}</th>`; });
    html += `</tr></thead><tbody>`;
    (c.table.rows||[]).forEach(row=>{
      html += `<tr>`;
      row.forEach(cell=>{ html += `<td>${cell}</td>`; });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
    if(c.table.footnote){ html += `<p class="prose" style="font-size:14.5px;color:var(--slate);margin-top:8px;">${c.table.footnote}</p>`; }
    html += `</div>`;
  }

  if(c.tables && c.tables.length){
    c.tables.forEach(t=>{
      html += `<div class="section-block">`;
      if(t.title){ html += `<h3>${t.title}</h3>`; }
      html += `<div class="table-scroll-wrap"><table class="authority-table"><thead><tr>`;
      t.columns.forEach(col=>{ html += `<th>${col}</th>`; });
      html += `</tr></thead><tbody>`;
      (t.rows||[]).forEach(row=>{
        html += `<tr>`;
        row.forEach(cell=>{ html += `<td>${cell}</td>`; });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
      if(t.footnote){ html += `<p class="prose" style="font-size:14.5px;color:var(--slate);margin-top:8px;">${t.footnote}</p>`; }
      html += `</div>`;
    });
  }

  if(c.steps && c.steps.length){
    html += `<div class="section-block"><h3>ขั้นตอน</h3><div class="sub-list">`;
    c.steps.forEach(s=>{
      html += `<div class="sub-item"><strong style="color:var(--ink);">${s.title}</strong><br>${s.detail}</div>`;
    });
    html += `</div></div>`;
  }

  if(c.note_extra){
    html += `<div class="manual-note"><strong>หมายเหตุเพิ่มเติม:</strong> ${c.note_extra}</div>`;
  }

  main.innerHTML = html;
}

let matrixViewOn = false;
const matrixBtn = document.getElementById('matrixToggleBtn');
const normalLayout = document.getElementById('manualNormalLayout');
const matrixView = document.getElementById('matrixView');

matrixBtn.addEventListener('click', ()=>{

let matrixSortMode = 'rank'; // 'rank' | 'category' | 'holder'

function renderMatrixView(){
  const rows = [];
  MANUAL_ITEMS.forEach(item=>{
    if(item.authority && item.authority.length){
      item.authority.forEach(a=>{
        rows.push({
          source: (item.chapter_no===99?'ผนวก ':'หมวด '+item.chapter_no+'.') + item.section_no,
          title: item.title,
          id: item.id,
          holder: a.holder,
          category: a.category,
          limit: a.limit,
          note: a.note||''
        });
      });
    }
  });

  // sort by a rough authority-level rank if detectable in holder text, else keep source order
  const rankOf = (h)=>{
    if(h.includes('ผู้ช่วยผู้ว่าการ')) return 5;
    if(h.includes('รองผู้ว่าการ')) return 4;
    if(h.includes('ผู้ว่าการ')) return 6;
    if(h.includes('ผู้อำนวยการฝ่าย')) return 3;
    if(h.includes('ผู้อำนวยการกอง')) return 2;
    if(h.includes('หัวหน้าสำนักงาน')) return 1;
    return 0;
  };

  if(matrixSortMode === 'category'){
    rows.sort((a,b)=> a.category.localeCompare(b.category, 'th') || rankOf(a.holder) - rankOf(b.holder));
  } else if(matrixSortMode === 'holder'){
    rows.sort((a,b)=> a.holder.localeCompare(b.holder, 'th') || a.category.localeCompare(b.category, 'th'));
  } else {
    rows.sort((a,b)=> rankOf(a.holder) - rankOf(b.holder));
  }

  const sortLabel = { rank: 'ระดับตำแหน่ง (ต่ำ→สูง)', category: 'ประเภท (ก-ฮ)', holder: 'ผู้มีอำนาจ (ก-ฮ)' }[matrixSortMode];

  let html = `
    <div class="matrix-export-row">
      <button class="export-btn excel" id="exportExcelBtn">📊 ดาวน์โหลด Excel (.xlsx)</button>
      <button class="export-btn pdf" id="exportPdfBtn">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
    </div>
    <div class="ask-result-head" style="margin-bottom:12px;">
      <h3 style="font-size:20px;">⚖️ ตารางอำนาจอนุมัติรวมทั้งเล่ม</h3>
    </div>
    <div class="cat-row" style="margin-bottom:14px;">
      <span style="font-size:14px;color:var(--slate);align-self:center;margin-right:4px;">เรียงตาม:</span>
      <button class="chip ${matrixSortMode==='rank'?'active':''}" data-sort="rank">ระดับตำแหน่ง</button>
      <button class="chip ${matrixSortMode==='category'?'active':''}" data-sort="category">ประเภท</button>
      <button class="chip ${matrixSortMode==='holder'?'active':''}" data-sort="holder">ผู้มีอำนาจ</button>
    </div>
    <p class="prose" style="margin-bottom:18px;">
      รวบรวมจากทุกหัวข้อในคู่มือที่มีข้อมูลอำนาจอนุมัติชัดเจน (${new Set(rows.map(r=>r.id)).size} หัวข้อ, ${rows.length} รายการ)
      — กำลังเรียงตาม<strong>${sortLabel}</strong> — คลิกแถวเพื่อเปิดหัวข้อต้นทางดูรายละเอียดเพิ่มเติม
    </p>
    <table class="authority-table" style="font-size:15.5px;">
      <thead><tr>
        <th style="width:12%">อ้างอิง</th>
        <th style="width:18%">ประเภท</th>
        <th style="width:22%">ผู้มีอำนาจ</th>
        <th style="width:30%">วงเงิน/ขอบเขต</th>
        <th style="width:18%">มาจากหัวข้อ</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr class="matrix-row" data-id="${r.id}" style="cursor:pointer;">
            <td><span class="reg-no">${r.source}</span></td>
            <td>${r.category}</td>
            <td><strong>${r.holder}</strong></td>
            <td>${r.limit}${r.note?' <span style="color:var(--slate);font-size:13px;">('+r.note+')</span>':''}</td>
            <td style="font-size:13.5px;color:var(--blue);">${r.title.length>30?r.title.slice(0,30)+'…':r.title}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <p class="prose" style="font-size:13px;color:var(--slate);margin-top:16px;">
      หมายเหตุ: ตารางนี้ครอบคลุมเฉพาะหัวข้อที่มีการยืนยันข้อมูลอำนาจอนุมัติแบบมีโครงสร้างแล้ว
      ยังมีอีกหลายหัวข้อในคู่มือที่มีข้อมูลอำนาจอยู่ในเนื้อหาแต่ยังไม่ได้จัดเป็นตาราง — ทยอยเพิ่มได้ในอนาคต
    </p>
  `;
  matrixView.innerHTML = html;
  window.__matrixRows = rows; // store for export functions
  matrixView.querySelectorAll('.cat-row .chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      matrixSortMode = el.dataset.sort;
      renderMatrixView();
    });
  });
  matrixView.querySelectorAll('.matrix-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      matrixViewOn = false;
      normalLayout.style.display = 'grid';
      matrixView.style.display = 'none';
      matrixBtn.style.background = 'var(--purple)';
      matrixBtn.textContent = '⚖️ ตารางอำนาจอนุมัติรวม';
      manualSelectedId = el.dataset.id;
      renderManualList();
      renderManualDetail();
      document.querySelector('#viewManual .main').scrollTop = 0;
    });
  });
  document.getElementById('exportExcelBtn').addEventListener('click', exportMatrixExcel);
  document.getElementById('exportPdfBtn').addEventListener('click', exportMatrixPDF);
}

function exportMatrixExcel(){
  const rows = window.__matrixRows || [];
  const sheetData = [
    ['อ้างอิง', 'ประเภท', 'ผู้มีอำนาจ', 'วงเงิน/ขอบเขต', 'หมายเหตุ', 'มาจากหัวข้อ']
  ];
  rows.forEach(r=>{
    sheetData.push([r.source, r.category, r.holder, r.limit, r.note, r.title]);

}

    return `
    <div class="reg-card ${item.id===critSelectedId?'selected':''} ${item.is_deep_manual?'deep-manual-card':''}" data-id="${item.id}">
      <div class="row1">
        <span class="doctype-badge ${item.doc_type}">${item.is_deep_manual?'📖 ':''}${DOCTYPE_LABEL[item.doc_type]||item.doc_type}</span>
        <span class="confidence-badge ${conf}">${CONFIDENCE_LABEL[conf]}</span>
      </div>
      <div class="reg-title" style="margin-top:6px;">${item.title}</div>
      <div class="reg-date">${item.date||''}${item.case_ref?' · '+item.case_ref:''}</div>
      ${item.is_deep_manual?'<div style="font-size:13.5px;color:var(--blue);font-weight:700;margin-top:4px;">📖 คู่มือเชิงลึก — คลิกเพื่อเปิดอ่านแบบเต็ม</div>':''}
    </div>
  `;}).join('');
  list.querySelectorAll('.reg-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      critSelectedId = el.dataset.id;
      const item = CRIT_ITEMS.find(i=>i.id===critSelectedId);
      renderCritList();
      if(item && item.is_deep_manual && item.chapters && item.chapters.length){
        openCritDeepManual(critSelectedId);
      } else {
        renderCritDetail();
      }
    });
  });
}

function renderCritDetail(){
  const main = document.getElementById('critMainPanel');
  const item = CRIT_ITEMS.find(i=>i.id===critSelectedId);
  if(!item) return;
  const ab = item.authority_basis || {};
  const conf = ab.confidence || 'pending';

  let html = `
    <div class="detail-head">
      <div class="badge-row">
        <span class="doctype-badge ${item.doc_type}">${DOCTYPE_LABEL[item.doc_type]||item.doc_type}</span>
        <span class="confidence-badge ${conf}">${CONFIDENCE_LABEL[conf]}</span>
      </div>
      <h2>${item.title}</h2>
      <div class="detail-meta">${item.date?'วันที่ '+item.date+' · ':''}${item.case_ref?item.case_ref+' · ':''}
        ${item.source_url ? `<a href="${item.source_url}" target="_blank" rel="noopener">เปิดต้นฉบับ (Google Drive) ↗</a>` : ''}
      </div>
    </div>
  `;

  // ---- Authority basis: ใคร / หลักอะไร / มติไหน ----
  html += `
    <div class="section-block">
      <h3>สายโซ่อำนาจ (Authority Basis)</h3>
      <div class="authority-basis-card">
        <div class="ab-row"><span class="ab-label">ใครมีอำนาจ:</span> ${ab.decision_maker || '<em style="color:var(--slate);">ยังไม่ทราบแน่ชัด</em>'}</div>
        <div class="ab-row"><span class="ab-label">อาศัยหลักอะไร:</span>
          ${(ab.legal_grounds && ab.legal_grounds.length)
            ? ab.legal_grounds.map(g=>`<span class="legal-ground-chip ${g.link_id?'clickable':''}" ${g.link_id?'data-link="'+g.link_id+'"':''}>${g.ref}</span>`).join('')
            : '<em style="color:var(--slate);">ยังไม่ระบุ</em>'}
        </div>
        <div class="ab-row"><span class="ab-label">จากมติ/บันทึก:</span> ${ab.resolution_ref || '<em style="color:var(--slate);">ไม่มี/ยังไม่พบ</em>'}</div>
      </div>
    </div>
  `;

  if(item.case_ref || item.applies_to){
    html += `<div class="section-block"><h3>ขอบเขตกรณีนี้</h3>`;
    if(item.case_ref) html += `<p class="prose"><strong>อ้างอิงกรณี:</strong> ${item.case_ref}</p>`;
    if(item.applies_to) html += `<p class="prose"><strong>ใช้เทียบเคียงได้กับ:</strong> ${item.applies_to}</p>`;
    html += `</div>`;
  }

  if(item.content){
    if(item.content.overview){
      html += `<div class="section-block"><h3>ภาพรวม</h3><p class="prose">${item.content.overview}</p></div>`;
    }
    if(item.content.steps && item.content.steps.length){
      html += `<div class="section-block"><h3>รายละเอียด</h3><div class="sub-list">`;
      item.content.steps.forEach(s=>{
        html += `<div class="sub-item"><strong style="color:var(--ink);">${s.title}</strong><br>${s.detail}</div>`;
      });
      html += `</div></div>`;
    }
  }

  if(item.tags && item.tags.length){
    html += `<div class="section-block"><h3>คำสำคัญ</h3><div class="tag-row">${item.tags.map(t=>`<span class="tag" data-tag="${t}">#${t}</span>`).join('')}</div></div>`;
  }

  if(item.related_regulation && item.related_regulation.length){
    html += `<div class="section-block"><h3>เชื่อมโยงกับข้อบังคับ</h3>`;
    item.related_regulation.forEach(rid=>{
      html += `<button class="xlink-btn" data-xlink="${rid}">📋 เปิดฉบับที่เกี่ยวข้องในทะเบียนข้อบังคับ →</button>`;
    });
    html += `</div>`;
  }

  // ---- Embedded document viewer (ตามที่ขอ) ----
  if(item.source_url){
    const fileIdMatch = item.source_url.match(/\/d\/([^/]+)/);
    const fileId = fileIdMatch ? fileIdMatch[1] : null;
    if(fileId){
      html += `
        <div class="section-block">
          <button class="doc-viewer-btn" id="toggleDocViewerBtn">📄 ดูเอกสารต้นฉบับประกอบ</button>
          <div id="docViewerContainer" style="display:none;">
            <iframe class="doc-viewer-frame" src="https://drive.google.com/file/d/${fileId}/preview"></iframe>
          </div>
        </div>
      `;
    }
  }

  main.innerHTML = html;

  const toggleBtn = document.getElementById('toggleDocViewerBtn');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{
      const c = document.getElementById('docViewerContainer');
      const showing = c.style.display !== 'none';
      c.style.display = showing ? 'none' : 'block';
      toggleBtn.textContent = showing ? '📄 ดูเอกสารต้นฉบับประกอบ' : '✕ ซ่อนเอกสารต้นฉบับ';
    });
  }

  main.querySelectorAll('.legal-ground-chip.clickable').forEach(el=>{
    el.addEventListener('click', ()=>{
      tabBrowseBtn.click();
      selectedId = el.dataset.link;
      renderList();
      renderDetail();
    });
  });
  main.querySelectorAll('.xlink-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      tabBrowseBtn.click();
      selectedId = el.dataset.xlink;
      renderList();
      renderDetail();
    });
  });
  main.querySelectorAll('.tag').forEach(el=>{
    el.addEventListener('click', ()=>{
      const kw = el.dataset.tag;
      critSearchTerm = kw;
      document.getElementById('critSearchInput').value = kw;
      critActiveType = 'ทั้งหมด';
      renderCritChips(); renderCritActiveFilters(); renderCritList();
    });
  });
}

function renderCritInitialState(){
  document.getElementById('critMainPanel').innerHTML = `
    <div class="empty-state">
      <div class="icon">📚</div>
      <div>เลือกเอกสารทางซ้ายเพื่อดูรายละเอียด<br><span style="font-size:16.5px;">หลักเกณฑ์ กฎหมายอ้างอิง คู่มือเฉพาะเรื่อง และบันทึกกรณีเฉพาะ</span></div>
    </div>
  `;
}

document.getElementById('critSearchInput').addEventListener('input', (e)=>{
  critSearchTerm = e.target.value;
  renderCritActiveFilters();
  renderCritList();
});
document.getElementById('critClearBtn').addEventListener('click', ()=>{
  critSearchTerm = '';
  critActiveType = 'ทั้งหมด';
  document.getElementById('critSearchInput').value = '';
  renderCritChips();
  renderCritActiveFilters();
  renderCritList();
});

// ---------- CRITERIA TAB: DEEP MANUAL NESTED VIEW ----------
// สำหรับ item ที่ is_deep_manual===true และมี chapters[] — เปิดเต็มพื้นที่คล้าย tab คู่มือบริหารชุมชน
// โครงสร้างนี้ generic ตาม chapters[]/sections[] — ใช้ซ้ำได้กับคู่มือเชิงลึกเล่มถัดๆ ไปโดยไม่ต้องแก้โค้ดนี้อีก
let critDeepOn = false;
let critDeepItem = null;
let critDeepSectionId = null;
let critDeepShowSummary = false;
const critDeepView = document.getElementById('critDeepView');
const critNormalLayout = document.querySelector('#viewCriteria .layout');

function openCritDeepManual(itemId){
  const item = CRIT_ITEMS.find(i=>i.id===itemId);
  if(!item || !item.chapters || !item.chapters.length) return;
  critDeepItem = item;
  const firstSec = item.chapters[0].sections && item.chapters[0].sections[0];
  critDeepSectionId = firstSec ? firstSec.id : null;
  // เปิดแท็บสรุปเป็นค่าเริ่มต้นถ้ามี summary_view — เห็นภาพรวมก่อนค่อยไล่อ่านทีละบท
  // (ยืนยันแล้วว่าอาการค้างก่อนหน้าเป็นเรื่องของอุปกรณ์ ไม่ใช่โค้ด — ตารางมี word-break/scroll-wrap ป้องกันล้นจอแล้ว)
  critDeepShowSummary = !!(item.summary_view && item.summary_view.tables && item.summary_view.tables.length);
  critDeepOn = true;
  critNormalLayout.style.display = 'none';
  critDeepView.style.display = 'block';
  renderCritDeepView();
  critDeepView.scrollTop = 0;
}

function closeCritDeepManual(){
  critDeepOn = false;
  critDeepItem = null;
  critDeepView.style.display = 'none';
  critNormalLayout.style.display = 'grid';
}

function critDeepFindSection(){
  if(!critDeepItem) return null;
  for(const ch of critDeepItem.chapters){
    const found = (ch.sections||[]).find(s=>s.id===critDeepSectionId);
    if(found) return found;
  }
  return null;
}

function renderCritDeepTable(t){
  return `
    <div class="section-block">
      ${t.title?`<h3>${t.title}</h3>`:''}
      <div class="table-scroll-wrap">
      <table class="authority-table">
        <thead><tr>${t.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>
          ${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
      </div>
      ${t.footnote?`<p class="prose" style="font-size:14px;color:var(--slate);margin-top:8px;">${t.footnote}</p>`:''}
    </div>
  `;
}

function renderCritDeepView(){
  const item = critDeepItem;
  if(!item) return;

  // ---- sidebar: ปุ่มกลับ + (ถ้ามี) แท็บสรุป + รายการบท/หัวข้อ ----
  let sidebarHtml = `<button class="clear-btn" id="critDeepBackBtn" style="width:100%;margin-bottom:14px;">← กลับไปหลักเกณฑ์เพิ่มเติม</button>`;

  if(item.summary_view && item.summary_view.tables && item.summary_view.tables.length){
    sidebarHtml += `
      <div class="reg-card ${critDeepShowSummary?'selected':''}" data-summary="1" style="border-left-color:var(--purple);">
        <div class="reg-title">📊 ${item.summary_view.title||'สรุปภาพรวม'}</div>
      </div>`;
  }

  item.chapters.forEach((ch,ci)=>{
    sidebarHtml += `<div style="font-size:13px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 6px;">บทที่ ${ci+1} · ${ch.chapter_title}</div>`;
    (ch.sections||[]).forEach(sec=>{
      const active = !critDeepShowSummary && sec.id === critDeepSectionId;
      sidebarHtml += `
        <div class="reg-card ${active?'selected':''}" data-sec="${sec.id}">
          <div class="reg-title" style="font-size:16.5px;">${sec.title}</div>
        </div>`;
    });
  });

  // ---- main content: แท็บสรุป หรือ เนื้อหา section ที่เลือก ----
  let mainHtml = '';
  if(critDeepShowSummary && item.summary_view){
    mainHtml += `<div class="detail-head"><h2>${item.summary_view.title||'สรุปภาพรวม'}</h2><div class="detail-meta">${item.title}</div></div>`;
    (item.summary_view.tables||[]).forEach(t=>{ mainHtml += renderCritDeepTable(t); });
  } else {
    const sec = critDeepFindSection();
    if(sec){
      mainHtml += `<div class="detail-head"><h2>${sec.title}</h2><div class="detail-meta">${item.title}</div></div>`;
      const c = sec.content || {};
      if(c.overview) mainHtml += `<div class="section-block"><h3>ภาพรวม</h3><p class="prose">${c.overview}</p></div>`;
      if(c.table) mainHtml += renderCritDeepTable(c.table);
      if(c.steps && c.steps.length){
        mainHtml += `<div class="section-block"><h3>รายละเอียด</h3><div class="sub-list">`;
        c.steps.forEach(s=>{
          mainHtml += `<div class="sub-item"><strong style="color:var(--ink);">${s.title}</strong><br>${s.detail}</div>`;
        });
        mainHtml += `</div></div>`;
      }
      if(c.note_extra) mainHtml += `<div class="manual-note"><strong>หมายเหตุเพิ่มเติม:</strong> ${c.note_extra}</div>`;
    } else {
      mainHtml = `<div class="empty-state"><div class="icon">📖</div><div>เลือกหัวข้อทางซ้ายเพื่อดูรายละเอียด</div></div>`;
    }
  }

  critDeepView.innerHTML = `
    <div class="detail-head" style="border-bottom:3px solid var(--blue);padding-bottom:14px;margin-bottom:0;">
      <div class="badge-row">
        <span class="doctype-badge ${item.doc_type}">📖 คู่มือเชิงลึก</span>
        ${item.authority_basis && item.authority_basis.confidence ? `<span class="confidence-badge ${item.authority_basis.confidence}">${CONFIDENCE_LABEL[item.authority_basis.confidence]}</span>` : ''}
      </div>
      <h2 style="margin-top:6px;">${item.title}</h2>
      <div class="detail-meta">${item.date?'วันที่ '+item.date+' · ':''}${item.source_url?`<a href="${item.source_url}" target="_blank" rel="noopener">เปิดต้นฉบับ (Google Drive) ↗</a>`:''}</div>
    </div>
    <div class="layout" style="min-height:calc(100vh - 300px);margin-top:16px;">
      <aside class="sidebar" style="max-height:none;overflow:visible;">${sidebarHtml}</aside>
      <main class="main" style="max-height:none;overflow:visible;">${mainHtml}</main>
    </div>
  `;

  document.getElementById('critDeepBackBtn').addEventListener('click', closeCritDeepManual);
  critDeepView.querySelectorAll('[data-sec]').forEach(el=>{
    el.addEventListener('click', ()=>{
      critDeepShowSummary = false;
      critDeepSectionId = el.dataset.sec;
      renderCritDeepView();
      const m = critDeepView.querySelector('.main');
      if(m) m.scrollTop = 0;
    });
  });
  const summaryEl = critDeepView.querySelector('[data-summary]');
  if(summaryEl){
    summaryEl.addEventListener('click', ()=>{
      critDeepShowSummary = true;
      renderCritDeepView();
      const m = critDeepView.querySelector('.main');
      if(m) m.scrollTop = 0;
    });
  }
}
</script>
</body>
</html>
